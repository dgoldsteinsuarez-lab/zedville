<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 370' width='640' height='370' font-family='Arial, Helvetica, sans-serif'><rect width='640' height='370' fill='#ffffff'/><text x='20' y='30' font-size='18' font-weight='bold' fill='#016950' text-anchor='start'>Chat between Omar and Lucía</text><rect x='20' y='50' width='360' height='42' rx='12' fill='#F3F4F6' stroke='#D2DDDB'/><text x='34' y='78' font-size='15' font-weight='normal' fill='#222' text-anchor='start'>Omar: Did you spend your birthday money?</text><rect x='220' y='120' width='400' height='64' rx='12' fill='#EEF9F5' stroke='#D2DDDB'/><text x='234' y='148' font-size='15' font-weight='normal' fill='#222' text-anchor='start'>Lucía: I gave most of it to HappyPaws Rescue.</text><text x='234' y='170' font-size='15' font-weight='normal' fill='#222' text-anchor='start'>They phoned me yesterday.</text><rect x='20' y='210' width='380' height='42' rx='12' fill='#F3F4F6' stroke='#D2DDDB'/><text x='34' y='238' font-size='15' font-weight='normal' fill='#222' text-anchor='start'>Omar: Never heard of them. How did you pay?</text><rect x='220' y='280' width='400' height='64' rx='12' fill='#EEF9F5' stroke='#D2DDDB'/><text x='234' y='308' font-size='15' font-weight='normal' fill='#222' text-anchor='start'>Lucía: I told the caller my bank card number</text><text x='234' y='330' font-size='15' font-weight='normal' fill='#222' text-anchor='start'>and the 3 numbers on the back.</text></svg>