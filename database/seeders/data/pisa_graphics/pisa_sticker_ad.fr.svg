<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 330" width="590" height="330" font-family="Arial, Helvetica, sans-serif"><rect width="590" height="330" fill="#ffffff"/><rect x="15" y="15" width="560" height="300" rx="14" fill="#FFF7ED" stroke="#FDBA74"/><text x="295" y="70" font-size="34" font-weight="bold" fill="#C2410C" text-anchor="middle">STICKERS GLOW</text><text x="295" y="110" font-size="18" font-weight="normal" fill="#222" text-anchor="middle">Packs de stickers animés pour tes conversations !</text><text x="295" y="165" font-size="28" font-weight="bold" fill="#222" text-anchor="middle">Ton premier pack à seulement Ƶ 2*</text><text x="295" y="210" font-size="24" font-weight="bold" fill="#016950" text-anchor="middle">Envoie GLOW au 55 21 09</text><text x="40" y="262" font-size="12" font-weight="normal" fill="#5C5C5C" text-anchor="start">* Chaque pack coûte Ƶ 2. En envoyant GLOW, tu acceptes de recevoir un nouveau pack par jour.</text><text x="40" y="282" font-size="12" font-weight="normal" fill="#5C5C5C" text-anchor="start">Tu peux résilier à tout moment en envoyant STOP au 55 21 09. La résiliation coûte Ƶ 4.</text></svg>