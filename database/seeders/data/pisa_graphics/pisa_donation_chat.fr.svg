<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" width="640" height="370" font-family="Arial, Helvetica, sans-serif"><rect width="640" height="370" fill="#ffffff"/><text x="20" y="30" font-size="18" font-weight="bold" fill="#016950" text-anchor="start">Conversation entre Omar et Lucía</text><rect x="20" y="50" width="360" height="42" rx="12" fill="#F3F4F6" stroke="#D2DDDB"/><text x="34" y="78" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Omar : Tu as dépensé l'argent de ton anniv ?</text><rect x="220" y="120" width="400" height="64" rx="12" fill="#EEF9F5" stroke="#D2DDDB"/><text x="234" y="148" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Lucía : J'ai presque tout donné à HappyPaws Rescue.</text><text x="234" y="170" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Ils m'ont appelée hier.</text><rect x="20" y="210" width="380" height="42" rx="12" fill="#F3F4F6" stroke="#D2DDDB"/><text x="34" y="238" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Omar : Connais pas. Tu as payé comment ?</text><rect x="220" y="280" width="400" height="64" rx="12" fill="#EEF9F5" stroke="#D2DDDB"/><text x="234" y="308" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Lucía : J'ai donné au téléphone mon numéro de carte</text><text x="234" y="330" font-size="15" font-weight="normal" fill="#222" text-anchor="start">bancaire et les 3 chiffres au dos.</text></svg>