<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 330" width="590" height="330" font-family="Arial, Helvetica, sans-serif"><rect width="590" height="330" fill="#ffffff"/><rect x="15" y="15" width="560" height="300" rx="14" fill="#FFF7ED" stroke="#FDBA74"/><text x="295" y="70" font-size="34" font-weight="bold" fill="#C2410C" text-anchor="middle">GLOW-STICKER</text><text x="295" y="110" font-size="18" font-weight="normal" fill="#222" text-anchor="middle">Animierte Sticker-Packs für deine Chats!</text><text x="295" y="165" font-size="28" font-weight="bold" fill="#222" text-anchor="middle">Dein erstes Pack für nur Ƶ 2*</text><text x="295" y="210" font-size="24" font-weight="bold" fill="#016950" text-anchor="middle">Sende GLOW an 55 21 09</text><text x="40" y="262" font-size="12" font-weight="normal" fill="#5C5C5C" text-anchor="start">* Jedes Pack kostet Ƶ 2. Mit der SMS GLOW stimmst du zu, täglich ein neues Pack zu erhalten.</text><text x="40" y="282" font-size="12" font-weight="normal" fill="#5C5C5C" text-anchor="start">Du kannst jederzeit per SMS STOP an 55 21 09 kündigen. Die Kündigung kostet Ƶ 4.</text></svg>