<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 306' width='660' height='306' font-family='Arial, Helvetica, sans-serif'><rect width='660' height='306' fill='#ffffff'/><text x='20' y='34' font-size='22' font-weight='bold' fill='#016950' text-anchor='start'>Should Tom switch his loan?</text><rect x='20' y='56' width='620' height='40' fill='#00A47D'/><text x='32' y='82' font-size='15' font-weight='bold' fill='#fff' text-anchor='start'></text><text x='262' y='82' font-size='15' font-weight='bold' fill='#fff' text-anchor='start'>Current loan</text><text x='422' y='82' font-size='15' font-weight='bold' fill='#fff' text-anchor='start'>New offer (Rival Bank)</text><rect x='20' y='96' width='620' height='40' fill='#EEF9F5' stroke='#D2DDDB'/><text x='32' y='122' font-size='15' font-weight='normal' fill='#222' text-anchor='start'>Amount still owed</text><text x='262' y='122' font-size='15' font-weight='normal' fill='#222' text-anchor='start'>Ƶ 6,000</text><text x='422' y='122' font-size='15' font-weight='normal' fill='#222' text-anchor='start'>Ƶ 6,000</text><rect x='20' y='136' width='620' height='40' fill='#fff' stroke='#D2DDDB'/><text x='32' y='162' font-size='15' font-weight='normal' fill='#222' text-anchor='start'>Interest per year</text><text x='262' y='162' font-size='15' font-weight='normal' fill='#222' text-anchor='start'>12%</text><text x='422' y='162' font-size='15' font-weight='normal' fill='#222' text-anchor='start'>8%</text><rect x='20' y='176' width='620' height='40' fill='#EEF9F5' stroke='#D2DDDB'/><text x='32' y='202' font-size='15' font-weight='normal' fill='#222' text-anchor='start'>Years left</text><text x='262' y='202' font-size='15' font-weight='normal' fill='#222' text-anchor='start'>2</text><text x='422' y='202' font-size='15' font-weight='normal' fill='#222' text-anchor='start'>2</text><rect x='20' y='216' width='620' height='40' fill='#fff' stroke='#D2DDDB'/><text x='32' y='242' font-size='15' font-weight='normal' fill='#222' text-anchor='start'>One-off fee to switch</text><text x='262' y='242' font-size='15' font-weight='normal' fill='#222' text-anchor='start'>-</text><text x='422' y='242' font-size='15' font-weight='normal' fill='#222' text-anchor='start'>Ƶ 300</text><text x='20' y='288' font-size='13' font-weight='normal' fill='#5C5C5C' text-anchor='start'>To keep it simple: interest is charged on the full Ƶ 6,000 in each of the 2 years.</text></svg>