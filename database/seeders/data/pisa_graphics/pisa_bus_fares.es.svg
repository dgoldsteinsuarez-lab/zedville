<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 266" width="610" height="266" font-family="Arial, Helvetica, sans-serif"><rect width="610" height="266" fill="#ffffff"/><text x="20" y="34" font-size="22" font-weight="bold" fill="#016950" text-anchor="start">Autobuses urbanos de Zedville - Tarifas</text><rect x="20" y="56" width="570" height="40" fill="#00A47D"/><text x="32" y="82" font-size="15" font-weight="bold" fill="#fff" text-anchor="start">Billete</text><text x="202" y="82" font-size="15" font-weight="bold" fill="#fff" text-anchor="start">Precio</text><text x="322" y="82" font-size="15" font-weight="bold" fill="#fff" text-anchor="start">Qué incluye</text><rect x="20" y="96" width="570" height="40" fill="#EEF9F5" stroke="#D2DDDB"/><text x="32" y="122" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Billete sencillo</text><text x="202" y="122" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Ƶ 2,50</text><text x="322" y="122" font-size="15" font-weight="normal" fill="#222" text-anchor="start">1 viaje</text><rect x="20" y="136" width="570" height="40" fill="#fff" stroke="#D2DDDB"/><text x="32" y="162" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Bono de 10 viajes</text><text x="202" y="162" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Ƶ 20,00</text><text x="322" y="162" font-size="15" font-weight="normal" fill="#222" text-anchor="start">10 viajes, sin caducidad</text><rect x="20" y="176" width="570" height="40" fill="#EEF9F5" stroke="#D2DDDB"/><text x="32" y="202" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Abono mensual</text><text x="202" y="202" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Ƶ 48,00</text><text x="322" y="202" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Viajes ilimitados durante 1 mes</text><text x="20" y="248" font-size="13" font-weight="normal" fill="#5C5C5C" text-anchor="start">Los