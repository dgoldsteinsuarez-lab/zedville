<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320" font-family="Arial, Helvetica, sans-serif"><rect width="620" height="320" fill="#ffffff"/><text x="20" y="34" font-size="22" font-weight="bold" fill="#016950" text-anchor="start">Bicis compartidas ZedRide - precios</text><rect x="20" y="56" width="580" height="40" fill="#00A47D"/><text x="32" y="82" font-size="15" font-weight="bold" fill="#fff" text-anchor="start"/><text x="432" y="82" font-size="15" font-weight="bold" fill="#fff" text-anchor="start">Precio</text><rect x="20" y="96" width="580" height="40" fill="#EEF9F5" stroke="#D2DDDB"/><text x="32" y="122" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Abono mensual</text><text x="432" y="122" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Ƶ 18 al mes</text><rect x="20" y="136" width="580" height="40" fill="#fff" stroke="#D2DDDB"/><text x="32" y="162" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Abono anual (todos los trayectos incluidos)</text><text x="432" y="162" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Ƶ 160 al año</text><rect x="20" y="176" width="580" height="40" fill="#EEF9F5" stroke="#D2DDDB"/><text x="32" y="202" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Trayectos de hasta 45 minutos (abono mensual)</text><text x="432" y="202" font-size="15" font-weight="normal" fill="#222" text-anchor="start">gratis</text><rect x="20" y="216" width="580" height="40" fill="#fff" stroke="#D2DDDB"/><text x="32" y="242" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Trayectos de 46 a 90 minutos (abono mensual)</text><text x="432" y="242" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Ƶ 3 cada uno</text><rect x="20" y="256" width="580" height="40" fill="#EEF9F5" stroke="#D2DDDB"/><text x="32" y="282" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Trayectos de 91 minutos o más (abono mensual)</text><text x="432" y="282" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Ƶ 5 cada uno</text></svg>