<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 590 330' width='590' height='330' font-family='Arial, Helvetica, sans-serif'><rect width='590' height='330' fill='#ffffff'/><rect x='15' y='15' width='560' height='300' rx='14' fill='#FFF7ED' stroke='#FDBA74'/><text x='295' y='70' font-size='34' font-weight='bold' fill='#C2410C' text-anchor='middle'>GLOW STICKERS</text><text x='295' y='110' font-size='18' font-weight='normal' fill='#222' text-anchor='middle'>Animated sticker packs for your chats!</text><text x='295' y='165' font-size='28' font-weight='bold' fill='#222' text-anchor='middle'>Get your first pack for just Ƶ 2*</text><text x='295' y='210' font-size='24' font-weight='bold' fill='#016950' text-anchor='middle'>Text GLOW to 55 21 09</text><text x='40' y='262' font-size='12' font-weight='normal' fill='#5C5C5C' text-anchor='start'>* Each pack costs Ƶ 2. By texting GLOW you agree to receive a new pack every day.</text><text x='40' y='282' font-size='12' font-weight='normal' fill='#5C5C5C' text-anchor='start'>   You can cancel at any time by texting STOP to 55 21 09. Cancelling costs Ƶ 4.</text></svg>