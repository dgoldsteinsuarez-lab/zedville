<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 266" width="540" height="266" font-family="Arial, Helvetica, sans-serif"><rect width="540" height="266" fill="#ffffff"/><text x="20" y="34" font-size="22" font-weight="bold" fill="#016950" text-anchor="start">Impôt sur le revenu à Zedville (par an)</text><rect x="20" y="56" width="500" height="40" fill="#00A47D"/><text x="32" y="82" font-size="15" font-weight="bold" fill="#fff" text-anchor="start">Tranche de revenu annuel</text><text x="332" y="82" font-size="15" font-weight="bold" fill="#fff" text-anchor="start">Taux d'imposition</text><rect x="20" y="96" width="500" height="40" fill="#EEF9F5" stroke="#D2DDDB"/><text x="32" y="122" font-size="15" font-weight="normal" fill="#222" text-anchor="start">De Ƶ 0 à Ƶ 12 000</text><text x="332" y="122" font-size="15" font-weight="normal" fill="#222" text-anchor="start">0 %</text><rect x="20" y="136" width="500" height="40" fill="#fff" stroke="#D2DDDB"/><text x="32" y="162" font-size="15" font-weight="normal" fill="#222" text-anchor="start">De Ƶ 12 001 à Ƶ 40 000</text><text x="332" y="162" font-size="15" font-weight="normal" fill="#222" text-anchor="start">20 %</text><rect x="20" y="176" width="500" height="40" fill="#EEF9F5" stroke="#D2DDDB"/><text x="32" y="202" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Au-delà de Ƶ 40 000</text><text x="332" y="202" font-size="15" font-weight="normal" fill="#222" text-anchor="start">35 %</text><text x="20" y="248" font-size="13" font-weight="normal" fill="#5C5C5C" text-anchor="start">Chaque taux ne s'applique qu'à la part du revenu comprise dans sa tranche.</text></svg>